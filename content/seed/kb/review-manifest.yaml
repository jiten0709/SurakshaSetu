# Knowledge-base review record: FICTITIOUS, like every document it lists. Nothing is searchable until
# compliance approves it (TDD §2.2): `make kb-ingest` indexes only documents whose status here is
# `approved`, into the snapshot named for their collection below.
#
# - snapshots: one release per collection. Sessions pin the snapshot_id. A snapshot id already
#   recorded in catalog.corpus_snapshot is immutable: changing any approved document (or its status)
#   needs a new snapshot_id here, which supersedes the old one; the old points stay searchable.
# - documents: doc_id is the chunk ids' document key; path is relative to this directory. Each file's
#   front matter says what the document is; this file says whether it may be served.
# - Gold chunk ids in content/golden/retrieval/*.yaml come from these documents: after a content
#   change, list the new ids with `make kb-chunks` and relabel the golden sets deliberately.

snapshots:
  regulatory: {snapshot_id: regulatory-2026-09-29, approved_by: DUMMY-compliance}
  product: {snapshot_id: product-2026-09-29, approved_by: DUMMY-product.compliance}
