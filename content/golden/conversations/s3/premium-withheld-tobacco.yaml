id: s3-premium-withheld-tobacco
description: >-
  Tobacco declined in S1: the engine flags PREMIUM_WITHHELD, so every option card shows cover and
  features without a premium; applying needs a premium, so an advisor completes it (V7).
turns:
  - action: {type: START}
    expect: {state: S0, templates: [greeting]}
  - action: {type: CONSENT_SUBMIT, payload: {purposes: {P1: true, P2: false, P3: false}, age_18_plus: true}}
    expect: {state: S0, templates: [intent_ask]}
  - action: {type: INTENT, payload: {intent: new_purchase}}
    expect: {state: S1, templates: [RL-S1-AGE]}
  - text: "34"
    expect: {templates: [RL-S1-RESIDENCY]}
  - action: {type: SLOT, payload: {slot: residency, value: resident}}
    expect: {templates: [RL-S1-PINCODE]}
  - text: "411001"
    expect: {templates: [RL-S1-TOBACCO]}
  - action: {type: SLOT, payload: {slot: tobacco_12m, value: declined}}
    expect: {templates: [RL-S1-OCCUPATION], slots: {tobacco_12m: declined}}
  - text: salaried
    expect: {templates: [RL-S1-HEALTH]}
  - text: "no"
    expect: {templates: [RL-S1-PROPOSER]}
  - text: "yes"
    expect: {templates: [readback]}
  - text: "yes"
    expect: {state: S2, engine: {service: eligibility, outcome: ELIGIBLE, flags: [PREMIUM_WITHHELD]}}
  - text: just tell me the best plan
    expect: {templates: [short_path_offer]}
  - text: "yes"
    expect: {templates: [RL-S2-INCOME]}
  - text: 12 lpa
    expect: {templates: [readback]}
  - text: "yes"
    expect: {templates: [RL-S2-DEPENDANTS]}
  - text: my daughter is 2
    expect: {templates: [RL-S2-LIABILITIES]}
  - text: no loans
    expect: {templates: [needs_summary, summary_assumed, summary_question], engine: {service: suitability, outcome: FIT}}
  - text: "yes"
    expect:
      state: S3
      row: S2.2
      disclosures: ["999N001V02", "999N002V01"]
      contains: ["Premium not shown: it is worked out during application and underwriting."]
      lacks: ["Indicative premium:"]
  - action: {type: APPLY, payload: {uin: "999N001V02"}}
    expect: {state: S3, templates: [apply_needs_premium], actions: [HUMAN_REQUEST]}
