id: s0-privacy-faq
description: >-
  A question before consent (row CC4): S0 answers only about privacy, and until Step 22's privacy
  FAQ that is the S0 caveat; the consent prompt stays open.
turns:
  - text: hello
    expect: {state: S0, templates: [greeting]}
  - text: How will you use my information?
    script: {nlu-extract: [{intents: [GENERAL_FAQ], side_query: "How will you use my information?"}]}
    expect: {state: S0, templates: [side_query_caveat], form: true}
