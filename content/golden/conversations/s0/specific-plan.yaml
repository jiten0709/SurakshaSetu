id: s0-specific-plan
description: >-
  Consent plus specific_plan goes to Quote-Only (row S0.3). Until Step 19 the Quote-Only node is
  a stub, so only the state is expected; Step 19 updates this case.
turns:
  - action: {type: START}
    expect: {state: S0, templates: [greeting]}
  - action: {type: CONSENT_SUBMIT, payload: {purposes: {P1: true, P2: false, P3: false}, age_18_plus: true}}
    expect: {state: S0, templates: [intent_ask]}
  - action: {type: INTENT, payload: {intent: specific_plan}}
    expect: {state: QUOTE_ONLY}
