id: s0-hindi-notice
description: >-
  The notice requested in Hindi: the approved (DUMMY) hi-IN greeting, AI disclosure and notice
  from the Consent Service; consent on it re-pins the session's notice at capture (I7's
  exception, decided 2026-10-04).
turns:
  - action: {type: START}
    expect: {state: S0, templates: [greeting], form: true}
  - action: {type: NOTICE_LANGUAGE, payload: {language: hi-IN}}
    expect: {state: S0, templates: [greeting], form: true}
  - action: {type: CONSENT_SUBMIT, payload: {purposes: {P1: true, P2: false, P3: true}, age_18_plus: true}}
    expect: {state: S0, templates: [intent_ask], consent: {purposes: [P1, P3], language: hi-IN}}
  - action: {type: INTENT, payload: {intent: new_purchase}}
    expect: {state: S1}
