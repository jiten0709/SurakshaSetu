id: s0-full-consent
description: >-
  The greeting (template, AI disclosure, notice) opens the session; the consent form with every
  purpose and the 18+ box ticked is recorded by the Consent Service, and the intent quick reply
  moves the session to S1 with nothing slot-filled.
turns:
  - action: {type: START}
    expect: {state: S0, templates: [greeting], form: true, events: [TURN_INPUT, STATE_TRANSITION, RESPONSE_RELEASED], absent: [CONSENT_CAPTURED]}
  - action: {type: CONSENT_SUBMIT, payload: {purposes: {P1: true, P2: true, P3: true}, age_18_plus: true}}
    expect: {state: S0, templates: [intent_ask], form: false, consent: {method: structured_action, purposes: [P1, P2, P3], language: en-IN}}
  - action: {type: INTENT, payload: {intent: new_purchase}}
    expect: {state: S1, slot_rows: 0}
