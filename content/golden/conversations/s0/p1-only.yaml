id: s0-p1-only
description: >-
  P1 alone is enough to proceed (TDD §3.5); P2 is asked later, before any advisor hand-off. A
  free-text new_purchase intent moves the session to S1.
turns:
  - action: {type: START}
    expect: {state: S0, templates: [greeting], form: true}
  - action: {type: CONSENT_SUBMIT, payload: {purposes: {P1: true, P2: false, P3: false}, age_18_plus: true}}
    expect: {state: S0, templates: [intent_ask], consent: {method: structured_action, purposes: [P1]}}
  - text: I'd like to buy life cover for my family
    script: {nlu-extract: [{intents: [NEW_PURCHASE]}]}
    expect: {state: S1}
