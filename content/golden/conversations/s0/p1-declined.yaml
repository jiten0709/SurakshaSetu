id: s0-p1-declined
description: >-
  P1 refused on the form (row S0.2): Exit with the helpline and branch-locator template, nothing
  recorded by the Consent Service, and no slot rows.
turns:
  - action: {type: START}
    expect: {state: S0, templates: [greeting], form: true}
  - action: {type: CONSENT_SUBMIT, payload: {purposes: {P1: false, P2: true, P3: false}, age_18_plus: true}}
    expect: {state: EXIT, templates: [consent_declined], form: false, slot_rows: 0, absent: [CONSENT_CAPTURED]}
