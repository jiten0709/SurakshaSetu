id: s0-clarify-twice-default
description: >-
  An unclear intent is clarified twice; the third unclear answer defaults to new_purchase (TDD
  §3.5, kept as specified and logged as a CONFIG_NOTE for the specification owner).
turns:
  - action: {type: START}
    expect: {state: S0, templates: [greeting]}
  - action: {type: CONSENT_SUBMIT, payload: {purposes: {P1: true, P2: false, P3: false}, age_18_plus: true}}
    expect: {state: S0, templates: [intent_ask]}
  - text: hmm
    expect: {state: S0, templates: [clarify]}
  - text: not sure really
    expect: {state: S0, templates: [clarify]}
  - text: whatever you think
    expect: {state: S1}
