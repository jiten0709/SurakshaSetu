id: s2-amber-confirmation
description: >-
  Existing premiums of a tenth of income push the estimate into amber: S3 waits for the customer's
  explicit confirmation, then S2.2 moves on.
prelude: to-s2
turns:
  - action: {type: SLOT, payload: {slot: goals, value: income_protection}}
    expect: {templates: [RL-S2-INCOME]}
  - text: 12 lpa
    expect: {templates: [readback]}
  - text: "yes"
    expect: {templates: [RL-S2-INCOME-TYPE]}
  - action: {type: SLOT, payload: {slot: income_type, value: salaried}}
    expect: {templates: [RL-S2-DEPENDANTS]}
  - text: my wife is 32 and my son is 4
    expect: {templates: [RL-S2-LIABILITIES]}
  - text: no loans
    expect: {templates: [RL-S2-EXISTING-COVER]}
  - text: none
    expect: {templates: [RL-S2-EMPLOYER-COVER]}
  - text: "no"
    expect: {templates: [RL-S2-EXISTING-PREMIUM]}
  - text: 1.2 lakh a year
    expect: {templates: [readback], contains: ["Just to check: ₹1,20,000 a year. Is that right?"]}
  - text: "yes"
    expect: {templates: [RL-S2-ASSETS]}
  - action: {type: SLOT, payload: {slot: earmarked_assets_inr, value: declined}}
    expect: {templates: [RL-S2-BUDGET]}
  - action: {type: SLOT, payload: {slot: premium_budget_inr_pa, value: declined}}
    expect: {templates: [needs_summary, summary_question], engine: {service: suitability, outcome: FIT, result: {affordability: amber}}}
  - text: "yes"
    expect: {state: S2, row: S2.STAY, templates: [amber_confirm]}
  - action: {type: CONFIRM, payload: {confirmed: true}}
    expect: {state: S3, row: S2.2, reason: SUITABLE, templates: [needs_done]}
