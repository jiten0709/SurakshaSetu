id: s2-implausible-loans
description: >-
  Loans more than 40 times income: the engine's Plausibility table reports IMPLAUSIBLE_INPUT, the
  summary asks the customer to check the figures (soft validation, no thresholds in Python), and a
  "yes" proceeds with the flag kept in the decision for underwriting.
prelude: to-s2
turns:
  - action: {type: SLOT, payload: {slot: goals, value: income_protection}}
    expect: {templates: [RL-S2-INCOME]}
  - text: 3 lakh
    expect: {templates: [readback], contains: ["₹3,00,000 a year"]}
  - text: "yes"
    expect: {templates: [RL-S2-INCOME-TYPE]}
  - action: {type: SLOT, payload: {slot: income_type, value: salaried}}
    expect: {templates: [RL-S2-DEPENDANTS]}
  - text: wife 30
    expect: {templates: [RL-S2-LIABILITIES]}
  - text: home loan of 1.5 crore, 20 years left
    expect: {templates: [readback], contains: ["To confirm: home loan, ₹1,50,00,000 outstanding, 20 years left. Correct?"]}
  - text: "yes"
    expect: {templates: [RL-S2-EXISTING-COVER]}
  - text: none
    expect: {templates: [RL-S2-EMPLOYER-COVER]}
  - text: "no"
    expect: {templates: [RL-S2-EXISTING-PREMIUM]}
  - text: none
    expect: {templates: [RL-S2-ASSETS]}
  - action: {type: SLOT, payload: {slot: earmarked_assets_inr, value: declined}}
    expect: {templates: [RL-S2-BUDGET]}
  - action: {type: SLOT, payload: {slot: premium_budget_inr_pa, value: declined}}
    expect:
      templates: [needs_summary, summary_implausible, summary_question]
      engine: {service: suitability, outcome: FIT, reason_codes: [SUIT-CAP-UW, IMPLAUSIBLE_INPUT]}
  - text: "yes"
    expect: {state: S3, row: S2.2, templates: [needs_done]}
