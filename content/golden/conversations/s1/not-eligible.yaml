id: s1-not-eligible
description: An unserviceable pincode makes the engine answer NOT_ELIGIBLE; S1.2 exits with the explanation, alternatives and helpline.
turns:
  - action: {type: START}
    expect: {state: S0, templates: [greeting]}
  - action: {type: CONSENT_SUBMIT, payload: {purposes: {P1: true, P2: false, P3: false}, age_18_plus: true}}
    expect: {state: S0, templates: [intent_ask]}
  - action: {type: INTENT, payload: {intent: new_purchase}}
    expect: {state: S1, row: S0.4, templates: [RL-S1-AGE]}
  - text: "34"
    expect: {templates: [RL-S1-RESIDENCY]}
  - action: {type: SLOT, payload: {slot: residency, value: resident}}
    expect: {templates: [RL-S1-PINCODE]}
  - text: "744101"
    expect: {templates: [RL-S1-TOBACCO]}
  - text: "no"
    expect: {templates: [RL-S1-OCCUPATION]}
  - text: salaried
    expect: {templates: [RL-S1-HEALTH]}
  - text: "no"
    expect: {templates: [RL-S1-PROPOSER]}
  - text: "yes"
    expect: {templates: [readback], contains: ["South Andaman"]}
  - text: "yes"
    expect: {state: EXIT, row: S1.2, reason: NOT_ELIGIBLE, templates: [not_eligible], contains: ["We can't yet serve your area online."], engine: {service: eligibility, outcome: NOT_ELIGIBLE}}
