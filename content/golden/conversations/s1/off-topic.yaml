id: s1-off-topic
description: Off-topic in S1 gets a one-line redirect and the pending question again; it is not counted as an invalid answer.
turns:
  - action: {type: START}
    expect: {state: S0, templates: [greeting]}
  - action: {type: CONSENT_SUBMIT, payload: {purposes: {P1: true, P2: false, P3: false}, age_18_plus: true}}
    expect: {state: S0, templates: [intent_ask]}
  - action: {type: INTENT, payload: {intent: new_purchase}}
    expect: {state: S1, row: S0.4, templates: [RL-S1-AGE]}
  - text: "34"
    expect: {templates: [RL-S1-RESIDENCY]}
  - text: did you watch the cricket last night
    script: {nlu-extract: [{intents: [OFF_TOPIC]}]}
    expect: {templates: [redirect, RL-S1-RESIDENCY], counters: {invalid_input: 0}}
