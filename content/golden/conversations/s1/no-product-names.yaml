id: s1-no-product-names
description: >-
  I3: a generated sentence naming a product fails the output rail, is regenerated once, fails
  again, and the question template goes out alone; no product is named before S3.
turns:
  - action: {type: START}
    expect: {state: S0, templates: [greeting]}
  - action: {type: CONSENT_SUBMIT, payload: {purposes: {P1: true, P2: false, P3: false}, age_18_plus: true}}
    expect: {state: S0, templates: [intent_ask]}
  - action: {type: INTENT, payload: {intent: new_purchase}}
    script:
      gen-converse: [Suraksha Term Shield is a great choice for you., Suraksha Term Shield is a great choice for you.]
    expect: {state: S1, parts: [template:RL-S1-AGE], lacks: [Suraksha], events: [MODEL_CALL, GUARD_VERDICT]}
