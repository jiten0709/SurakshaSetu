id: s1-serious-illness
description: >-
  "Yes" to the health screening question gets the empathetic acknowledgement and an advisor offer,
  never an insurability statement; no diagnosis is stored, and the engine flags MEDICAL_UW.
turns:
  - action: {type: START}
    expect: {state: S0, templates: [greeting]}
  - action: {type: CONSENT_SUBMIT, payload: {purposes: {P1: true, P2: false, P3: false}, age_18_plus: true}}
    expect: {state: S0, templates: [intent_ask]}
  - action: {type: INTENT, payload: {intent: new_purchase}}
    expect: {state: S1, row: S0.4, templates: [RL-S1-AGE]}
  - text: "34"
    expect: {templates: [RL-S1-RESIDENCY]}
  - action: {type: SLOT, payload: {slot: residency, value: resident}}
    expect: {templates: [RL-S1-PINCODE]}
  - text: "411001"
    expect: {templates: [RL-S1-TOBACCO]}
  - text: "no"
    expect: {templates: [RL-S1-OCCUPATION]}
  - text: salaried
    expect: {templates: [RL-S1-HEALTH]}
  - text: "yes"
    expect: {templates: [medical_ack, RL-S1-PROPOSER], slots: {health_flags: proposed}}
  - text: "yes"
    expect: {templates: [readback], contains: ["yes to the health question"]}
  - text: "yes"
    expect: {state: S2, row: S1.4, engine: {service: eligibility, outcome: ELIGIBLE, flags: [MEDICAL_UW]}}
