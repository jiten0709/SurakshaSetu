id: s1-age-16
description: >-
  An age under 18 takes the minor path before persistence (V2): no slot row is ever written, CC1b
  erases the session at once and the subject key is destroyed.
turns:
  - action: {type: START}
    expect: {state: S0, templates: [greeting]}
  - action: {type: CONSENT_SUBMIT, payload: {purposes: {P1: true, P2: false, P3: false}, age_18_plus: true}}
    expect: {state: S0, templates: [intent_ask]}
  - action: {type: INTENT, payload: {intent: new_purchase}}
    expect: {state: S1, row: S0.4, templates: [RL-S1-AGE]}
  - text: "16"
    expect: {state: DATA_ERASURE, row: CC1b, templates: [minor_exit], slot_rows: 0, erased: destroyed}
