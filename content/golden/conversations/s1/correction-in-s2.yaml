id: s1-correction-in-s2
description: >-
  V4: the pincode corrected in S2 writes a corrected row, G2 re-runs S1's rows (a new read-back),
  and the confirmed values go to the engine again.
turns:
  - action: {type: START}
    expect: {state: S0, templates: [greeting]}
  - action: {type: CONSENT_SUBMIT, payload: {purposes: {P1: true, P2: false, P3: false}, age_18_plus: true}}
    expect: {state: S0, templates: [intent_ask]}
  - action: {type: INTENT, payload: {intent: new_purchase}}
    expect: {state: S1, row: S0.4, templates: [RL-S1-AGE]}
  - text: "34"
    expect: {templates: [RL-S1-RESIDENCY]}
  - action: {type: SLOT, payload: {slot: residency, value: resident}}
    expect: {templates: [RL-S1-PINCODE]}
  - text: "411001"
    expect: {templates: [RL-S1-TOBACCO]}
  - text: "no"
    expect: {templates: [RL-S1-OCCUPATION]}
  - text: salaried
    expect: {templates: [RL-S1-HEALTH], slots: {occupation_code: proposed}}
  - text: "no"
    expect: {templates: [RL-S1-PROPOSER]}
  - text: "yes"
    expect: {templates: [readback]}
  - text: "yes"
    expect: {state: S2, row: S1.4}
  - text: my pincode is actually 411014
    script:
      nlu-extract:
        - {intents: [CORRECTION], slots: [{slot: pincode, value: "411014", confidence: 0.95, evidence_span: "411014"}]}
    expect: {state: S1, row: G2, reason: CORRECTION_ELIGIBILITY, templates: [readback], slots: {pincode: corrected}}
  - text: "yes"
    expect: {state: S2, row: S1.4, engine: {service: eligibility, outcome: ELIGIBLE}, slots: {pincode: confirmed}}
