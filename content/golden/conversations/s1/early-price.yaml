id: s1-early-price
description: >-
  A price asked for early offers the Quote-Only express path (applying still needs S2 and S3); the
  screening goes on, and once eligible S1.3 enters Quote-Only, which asks the customer to name a
  plan (I3).
turns:
  - action: {type: START}
    expect: {state: S0, templates: [greeting]}
  - action: {type: CONSENT_SUBMIT, payload: {purposes: {P1: true, P2: false, P3: false}, age_18_plus: true}}
    expect: {state: S0, templates: [intent_ask]}
  - action: {type: INTENT, payload: {intent: new_purchase}}
    expect: {state: S1, row: S0.4, templates: [RL-S1-AGE]}
  - text: how much would a plan cost me
    script: {nlu-extract: [{intents: [EXPRESS_PATH]}]}
    expect: {templates: [express_offer, RL-S1-AGE], counters: {express_path: 1}, slot_rows: 0}
  - text: "34"
    expect: {templates: [RL-S1-RESIDENCY]}
  - action: {type: SLOT, payload: {slot: residency, value: resident}}
    expect: {templates: [RL-S1-PINCODE]}
  - text: "411001"
    expect: {templates: [RL-S1-TOBACCO]}
  - text: "no"
    expect: {templates: [RL-S1-OCCUPATION]}
  - text: salaried
    expect: {templates: [RL-S1-HEALTH], slots: {occupation_code: proposed}}
  - text: "no"
    expect: {templates: [RL-S1-PROPOSER]}
  - text: "yes"
    expect: {templates: [readback]}
  - text: "yes"
    expect: {state: QUOTE_ONLY, row: S1.3, reason: EXPRESS_PATH, templates: [plan_ask], counters: {express_path: 0}}
