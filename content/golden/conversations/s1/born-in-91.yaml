id: s1-born-in-91
description: >-
  "born in '91": the deterministic normaliser works the age out from the year, which is right only
  to within a year, so it is read back before it is used; "no" asks the question again.
turns:
  - action: {type: START}
    expect: {state: S0, templates: [greeting]}
  - action: {type: CONSENT_SUBMIT, payload: {purposes: {P1: true, P2: false, P3: false}, age_18_plus: true}}
    expect: {state: S0, templates: [intent_ask]}
  - action: {type: INTENT, payload: {intent: new_purchase}}
    expect: {state: S1, row: S0.4, templates: [RL-S1-AGE]}
  - text: I was born in '91
    expect: {templates: [readback], slots: {age_years: proposed}}
  - text: "no"
    expect: {templates: [RL-S1-AGE]}
  - text: "34"
    expect: {templates: [RL-S1-RESIDENCY], slots: {age_years: corrected}}
