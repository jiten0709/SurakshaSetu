id: withdraw-s2
description: A withdrawal in S2, with consent - the Consent Service records it and the live rows go in the same turn (I5).
given: {consent: {purposes: [P1, P2]}, state: S2}
turns:
  - text: I withdraw my consent, please delete my data
    script: {nlu-extract: [{intents: [META_WITHDRAW]}]}
    expect: {state: DATA_ERASURE, templates: [erasure_done], events: [ERASURE_REQUEST, CONSENT_WITHDRAWN], erased: scheduled}
