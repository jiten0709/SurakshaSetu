id: withdraw-paused
description: A withdrawal from PAUSE skips the resume and erases in the same turn (I5).
given: {consent: {purposes: [P1]}, state: PAUSE, paused_from: S2}
turns:
  - text: actually, withdraw my consent and delete everything
    script: {nlu-extract: [{intents: [META_WITHDRAW]}]}
    expect: {state: DATA_ERASURE, templates: [erasure_done], events: [ERASURE_REQUEST, CONSENT_WITHDRAWN], erased: scheduled}
