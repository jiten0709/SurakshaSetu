id: qo-express-entry
description: >-
  Entered from S1's express path, eligibility is established and age and tobacco are already
  confirmed: the named plan is quoted at once, and opting into full advice goes to S2 (QO.3).
turns:
  - action: {type: START}
    expect: {state: S0, templates: [greeting]}
  - action: {type: CONSENT_SUBMIT, payload: {purposes: {P1: true, P2: false, P3: false}, age_18_plus: true}}
    expect: {state: S0, templates: [intent_ask]}
  - action: {type: INTENT, payload: {intent: new_purchase}}
    expect: {state: S1, templates: [RL-S1-AGE]}
  - text: just tell me the price
    script: {nlu-extract: [{intents: [EXPRESS_PATH]}]}
    expect: {templates: [express_offer, RL-S1-AGE]}
  - text: "34"
    expect: {templates: [RL-S1-RESIDENCY]}
  - action: {type: SLOT, payload: {slot: residency, value: resident}}
    expect: {templates: [RL-S1-PINCODE]}
  - text: "411001"
    expect: {templates: [RL-S1-TOBACCO]}
  - text: "no"
    expect: {templates: [RL-S1-OCCUPATION]}
  - text: salaried
    expect: {templates: [RL-S1-HEALTH]}
  - text: "no"
    expect: {templates: [RL-S1-PROPOSER]}
  - text: "yes"
    expect: {templates: [readback]}
  - action: {type: CONFIRM, payload: {confirmed: true}}
    expect: {state: QUOTE_ONLY, row: S1.3, templates: [plan_ask]}
  - text: 999N001V02
    expect: {parts: [template:quote_card, registry:DISC-GLOBAL-QUOTE-02, template:quote_caveat, template:quote_next], contains: ["₹16,000 a year"], engine: {service: quote}}
  - action: {type: OPT_IN}
    expect: {state: S2, row: QO.3, reason: ADVISORY_OPT_IN, templates: [screening_done]}
