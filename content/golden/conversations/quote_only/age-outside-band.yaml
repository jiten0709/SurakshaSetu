id: qo-age-outside-band
description: >-
  The ROP plan's entry ages end at 55: the adapter's 422 on age_years is not re-asked (age is a
  fact); the plan's age range is given and another plan asked for.
turns:
  - action: {type: START}
    expect: {state: S0, templates: [greeting]}
  - action: {type: CONSENT_SUBMIT, payload: {purposes: {P1: true, P2: false, P3: false}, age_18_plus: true}}
    expect: {state: S0, templates: [intent_ask]}
  - action: {type: INTENT, payload: {intent: specific_plan}}
    expect: {state: QUOTE_ONLY, row: S0.3, templates: [plan_ask], lacks: [Suraksha, "999N"]}
  - text: Suraksha Term Shield ROP
    expect: {state: QUOTE_ONLY, templates: [RL-S1-AGE]}
  - text: "60"
    expect: {templates: [RL-S1-TOBACCO], slots: {age_years: proposed}}
  - text: "no"
    expect: {templates: [readback], contains: ["To confirm: 60, no tobacco in the last 12 months. Correct?"], absent: [ENGINE_DECISION]}
  - text: "yes"
    expect: {templates: [age_bounds], contains: ["Suraksha Term Shield ROP is open to ages from 18 to 55"], absent: [ENGINE_DECISION]}
