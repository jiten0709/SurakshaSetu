id: qo-savings-plan
description: >-
  The savings plan is seeded but not launched: the quote adapter answers 409 PRODUCT_WITHDRAWN, the
  plan is said to be unavailable, and another named plan is quoted without asking again.
turns:
  - action: {type: START}
    expect: {state: S0, templates: [greeting]}
  - action: {type: CONSENT_SUBMIT, payload: {purposes: {P1: true, P2: false, P3: false}, age_18_plus: true}}
    expect: {state: S0, templates: [intent_ask]}
  - action: {type: INTENT, payload: {intent: specific_plan}}
    expect: {state: QUOTE_ONLY, row: S0.3, templates: [plan_ask], lacks: [Suraksha, "999N"]}
  - text: Suraksha Saver Guarantee
    expect: {state: QUOTE_ONLY, templates: [RL-S1-AGE]}
  - text: "34"
    expect: {templates: [RL-S1-TOBACCO], slots: {age_years: proposed}}
  - text: "no"
    expect: {templates: [readback], contains: ["To confirm: 34, no tobacco in the last 12 months. Correct?"], absent: [ENGINE_DECISION]}
  - text: "yes"
    expect: {templates: [plan_unavailable], contains: ["Suraksha Saver Guarantee isn't available to buy right now"], absent: [ENGINE_DECISION]}
  - text: Suraksha Term Shield then
    expect: {parts: [template:quote_card, registry:DISC-GLOBAL-QUOTE-02, template:quote_caveat, template:quote_next], contains: ["₹16,000 a year"]}
