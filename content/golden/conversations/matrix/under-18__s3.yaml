id: matrix-under-18-s3
description: >-
  TDD §3.9, S3 (same as S1): an age corrected to under 18 on the recommendation -> Data Erasure
  and the polite exit; the key destroyed.
prelude: to-s3
turns:
  - text: "yes"
    expect: {state: S3, row: S2.2}
  - text: I should say I'm only 17
    script: {nlu-extract: [{slots: [{slot: age_years, value: 17, confidence: 0.95, evidence_span: "17"}]}]}
    expect: {state: DATA_ERASURE, row: CC1b, templates: [minor_exit], erased: destroyed}
