id: matrix-declines-consent-s0
description: >-
  TDD §3.9, S0: P1 declined -> Exit with the helpline line, nothing collected; a privacy question
  afterwards is still answered from the public (privacy) FAQ.
turns:
  - action: {type: START}
    expect: {state: S0, templates: [greeting]}
  - action: {type: CONSENT_SUBMIT, payload: {purposes: {P1: false, P2: false, P3: false}, age_18_plus: true}}
    expect: {state: EXIT, row: S0.2, templates: [consent_declined], absent: [CONSENT_CAPTURED]}
  - text: What do you do with my data?
    script: {nlu-extract: [{intents: [GENERAL_FAQ], side_query: "What do you do with my data?"}]}
    expect: {state: EXIT, parts: ["faq:2026.10.1:PF-PURPOSES"], faq: "faq:PF-PURPOSES", absent: [MODEL_CALL, RETRIEVAL]}
