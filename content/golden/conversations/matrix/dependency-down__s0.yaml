id: matrix-dependency-down-s0
description: >-
  TDD §3.9, S0: unaffected (templates): with the guard and nlu-extract routes down, the consent
  prompt and the form still work, and consent is recorded.
turns:
  - action: {type: START}
    expect: {state: S0, templates: [greeting]}
  - text: hello there
    script: {guard-input: [{content: "guard unavailable", status: 503}], nlu-extract: [{content: "nlu unavailable", status: 503}]}
    expect: {state: S0, templates: [consent_reprompt], form: true}
  - action: {type: CONSENT_SUBMIT, payload: {purposes: {P1: true, P2: false, P3: false}, age_18_plus: true}}
    expect: {state: S0, templates: [intent_ask], events: [CONSENT_CAPTURED]}
