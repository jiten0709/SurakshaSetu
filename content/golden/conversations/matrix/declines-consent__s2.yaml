id: matrix-declines-consent-s2
description: >-
  TDD §3.9, S2 (same as S1): a withdrawal -> Data Erasure in the same turn (I5).
prelude: to-s2
turns:
  - action: {type: SLOT, payload: {slot: goals, value: income_protection}}
    expect: {templates: [RL-S2-INCOME]}
  - text: I don't want this any more, withdraw my consent
    script: {nlu-extract: [{intents: [META_WITHDRAW]}]}
    expect: {state: DATA_ERASURE, row: CC1, templates: [erasure_done], events: [ERASURE_REQUEST, CONSENT_WITHDRAWN], erased: scheduled}
