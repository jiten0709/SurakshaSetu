# Hindi and Hinglish -> English for retrieval's lexical query (TDD §2.4 step 1: "normalise Hinglish
# into an English lexical query, keeping the original for dense search"). The corpus is English, so
# BM25 only matches a Hindi or Hinglish question through these terms; BGE-M3 and the reranker read
# the original. DUMMY-era glossary: general life-insurance, tax and privacy vocabulary, written as a
# glossary and not fitted to golden questions. Linguistic review replaces it before pilot.
#
# Each key must be one token of the shared BM25 analyzer (surakshasetu/retrieval/bm25.py) and not a
# stopword; the loader refuses anything else. Words that are also common verbs ("kar", "कर") are
# left out on purpose: they would send non-tax questions to the tax route.

# Phrases that mean "the plan in focus" (TDD §2.4: "this plan" becomes the UIN in focus).
references:
  - this plan
  - this policy
  - this product
  - that plan
  - that policy
  - the same plan
  - yeh plan
  - ye plan
  - is plan
  - iss plan
  - yeh policy
  - is policy
  - iss policy
  - यह प्लान
  - ये प्लान
  - इस प्लान
  - यह पॉलिसी
  - इस पॉलिसी

