# Fixed conversational text, rendered from templates and never generated (TDD §3.4). `{name}` fields
# are filled by the system from slots and engine values. The hand-off and crisis scripts are legally
# significant and not yet supplied: they stay DUMMY placeholders until compliance approves them.

readback: "To confirm: {facts}. Correct?"
money_readback: "Just to check: {amount} a year. Is that right?"
needs_summary: |-
  Here is what you told me, and the assumptions used:
  {facts}
  Assumptions: cover to age {cover_to_age}, {dependency_years} years of dependency, income growth of {growth} a year, a discount rate of {discount} a year, {consumption} of income as your own spending, and {final_expenses} for final expenses.
clarify: "Sorry, I didn't quite follow. {question}"
ask_to_shorten: "That message is too long for me to read in one go. Could you shorten it and send it again?"
abstain: "I can't confirm that from the documents I have. A licensed advisor can help with this question."
advisor_offer: "Would you like a licensed advisor to contact you?"
release_blocked: "Sorry, I can't show this answer right now."
handoff: "DUMMY: I'm passing this conversation to a licensed advisor, who will continue with you. They will see a summary of your answers so far, so you won't need to repeat them. If you'd rather stop now, you can come back at any time."
safety: "DUMMY: I'm sorry you're feeling this way. You don't have to go through it alone. If you are in immediate danger, please call the emergency number 112 now. You can also talk to someone, free and in confidence, at KIRAN: 1800-599-0019 (24/7), any time of day. I'll pause everything else here."
# I6: the body is the registry's DISC-GLOBAL-AI-06, verbatim; the first line is the TDD §3.5 greeting.
ai_redisclosure: |-
  I'm SurakshaSetu, an AI assistant from {insurer}. I'm not a human advisor.
  {disclosure}
# Step 17: the cross-cutting handlers. The erasure, contact and advisor-consent texts are legally
# significant: DUMMY until compliance approves them.
erasure_done: "DUMMY: Done. Your consent is withdrawn, we have stopped using your information, and this conversation and your answers are deleted. The law requires us to keep an encrypted record of what was shown to you and of your consent choices; it is kept only for the period the law sets, and then becomes unreadable."
erasure_pending: "DUMMY: We have stopped using your information, and this conversation and your answers are deleted. Our consent system didn't confirm the withdrawal just now; we will keep trying until it is recorded, and you don't need to do anything. The law requires us to keep an encrypted record of what was shown to you; it is kept only for the period the law sets, and then becomes unreadable."
minor_exit: "DUMMY: Sorry, this service is only for people aged 18 or over, so I can't continue. Everything you shared has been deleted, and nothing that can be read is kept. A parent or guardian is welcome to contact us about cover for you."
contact_options: "DUMMY: You can speak to a licensed advisor on 1800-123-4567, Mon–Sat 8am–8pm, or visit a branch: https://www.surakshalife.example.com/branches."
advisor_consent_ask: "DUMMY: Would you like a licensed advisor to contact you? If you agree, we will share a summary of your answers so far with them, so you won't have to repeat yourself. Saying no is fine: you can still use the helpline or a branch, and you can change your mind at any time."
paused: "I've saved your progress. You can come back to this conversation any time before it expires."
# Step 18: State-0 (TDD §3.5). The greeting is the TDD wording. The AI disclosure (the registry's
# DISC-GLOBAL-AI-06) and the consent notice (the Consent Service's body) follow it verbatim; neither
# lives in the bundle. Consent texts the TDD does not give are DUMMY until compliance approves them.
greeting: |-
  Namaste, I'm SurakshaSetu, an AI assistant from {insurer}. I'm not a human advisor.
  I can help you work out how much life cover you may need and explain our plans.
  Final terms are decided during application and underwriting. This chat is recorded.
consent_reprompt: "Please choose your options below to continue."
consent_renew: "DUMMY: Before we continue: either our privacy notice has changed or your earlier consent has expired. Please read the notice below and choose your options again. Nothing you told us before is used until you do."
consent_retry: "Sorry, I can't record your choices right now. Please try again in a moment."
notice_updated: "DUMMY: The privacy notice changed while you were reading it. Here is the current version: please read it and choose your options again."
age_confirm_ask: "DUMMY: Before I continue, please confirm that you are 18 or older. Type yes or no."
consent_declined: "DUMMY: No problem: I won't collect any information. If you'd like to talk to someone, you can call 1800-123-4567, Mon–Sat 8am–8pm or find a branch at https://www.surakshalife.example.com/branches."
intent_ask: "Are you looking to explore new life insurance plans, or do you have questions about an existing policy?"
