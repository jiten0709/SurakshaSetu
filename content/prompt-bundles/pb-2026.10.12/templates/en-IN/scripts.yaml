# Step 19: State-1 (TDD §3.6) and Quote-Only. A slot question and its reason line follow these texts
# verbatim. Texts on health, non-disclosure, eligibility outcomes and re-engagement are DUMMY until
# underwriting and compliance approve them. Amounts, dates and plan names are filled by the system
# from the quote adapter's response and the catalog; the model writes none of them.
readback_fix: "Which detail should I change? Choose one below, or tell me the correct value."
format_hint: "No worries, let me ask it differently. {hint}"
redirect: "Let's get back to my question."
reask: "I need an answer to this one to continue."
screening_retry: "Sorry, I can't continue the checks right now. Please try again in a moment."
screening_done: "Thank you. Next, I'll ask about your family and finances, to work out what cover may suit you."
express_offer: "I can give you an indicative price for a plan you name once I've checked a few basics. Applying for a plan would still need a needs check and a recommendation first."
medical_ack: "DUMMY: Thank you for telling me. I won't ask for details here, and no details are stored: the insurer's underwriters ask about your health when you apply, and they decide how it affects cover. You can still see plans that fit your needs, and a licensed advisor can talk it through with you at any time."
underwriting_note: "DUMMY: I can't say how a particular health condition would be treated: whether cover is offered, and on what terms, is decided by the insurer's underwriters once you apply. A licensed advisor can talk you through how that review works."
nondisclosure_note: "DUMMY: Please answer each question accurately. If a fact that affects the cover, such as tobacco use, is left out or given wrongly, the insurer can question the policy or a claim later. Answering honestly now protects your family's claim."
not_eligible: "DUMMY: I'm sorry, I can't arrange cover for you in this chat. {reason} That isn't a decision about you as a person, and a licensed advisor can look at other options with you through our helpline or at any branch."
not_eligible_reasons:
  REASON_PIN_UNSERVICEABLE: "We can't yet serve your area online."
  default: "The plans available here don't fit the details you gave."
plan_ask: "Which plan would you like a price for? Please tell me its name or its UIN."
plan_unknown: "Sorry, I couldn't find that plan. Please check its name or UIN."
plan_unavailable: "{plan} isn't available to buy right now, so I can't price it. You can name another plan."
quote_card: |-
  Indicative premium for {plan} (UIN {uin}): {premium} {period}.
  Cover: {cover} for {term} years. Premium payment: {ppt}. Valid until {valid_until}.
# The standing caveat of INSURANCE_ASSISTANT_ARCHITECTURE.md (State 1, Quote-Only Mode), verbatim.
quote_caveat: "This is an indicative premium based on age, gender, and tobacco use only. It isn't advice on whether this plan suits you. If you'd like a proper recommendation, I'll need about four more minutes of questions."
quote_next: "Would you like a full needs check and a recommendation? Applying for any plan needs one."
quote_withheld: "I can't give a price without an answer about tobacco use, because premium rates depend on it. You can answer the tobacco question, or go on to a full needs check and recommendation."
cover_bounds: "For {plan}, cover can be {range}, in steps of {step}. How much cover would you like?"
term_bounds: "For {plan}, the policy term can be {range} years. How many years of cover would you like?"
age_bounds: "{plan} is open to ages {range}, so I can't price it for you. You can name another plan."
rating_unavailable: "Sorry, I can't calculate a price right now. Please try again in a moment."
hard_block: "An application needs a full needs check and a recommendation first, so I can't start one from an indicative quote. Would you like to start the needs check now?"
quote_summary: "Here is your indicative quote again: {plan} (UIN {uin}), {premium} {period}, valid until {valid_until}. Thank you for chatting with us."
reengage: "DUMMY: Because you agreed to receive product updates, we may send you one reminder about this quote before it expires. You can stop updates at any time by withdrawing that choice."
goodbye: "Thank you for chatting with us."
