# Cross-cutting completion (Step 22): the side-query subgraph, the objection handler,
# regulatory pushback and the never-store reminder. Legally significant texts are DUMMY.
side_query_bridge: "Coming back to where we were:"
side_query_offer: "You've asked a few questions in a row, which is fine. Would you like to carry on where we were, or talk to a licensed advisor?"
regime_ask: "Tax benefits depend on your tax regime. Are you on the old regime or the new one? I use this only to choose which rules to explain, never to work out your tax."
regime_confirm: "You mentioned the {regime}. Shall I use that when I explain tax rules?"
regime_noted: "Noted: I'll explain the tax rules for the {regime}."
material_fact_note: "DUMMY: The insurer has to ask about facts that affect the cover, called material facts. A missing or incorrect answer can affect a claim later, which is why each question says why it is asked. You can choose not to answer one; the insurer may then need to ask again when you apply."
suitability_purpose: "DUMMY: These questions help make any suggestion suitable for you, which the insurance rules require (IRDAI Master Circular on Life Insurance Products 2024, Section 5). You can skip any of them; the suggestion then says what it couldn't take into account."
objection_price_early: "DUMMY: The price depends on the cover, the term and your profile, so I can't give a figure yet. Once your needs are clear, I'll show indicative premiums, and lower-cost versions if you'd like them, along with what each one leaves uncovered."
objection_other: "DUMMY: I understand. Life cover is a way to protect your family from a financial risk they would otherwise carry; it isn't an investment. The decision is entirely yours, and you can stop at any time."
objection_repeat: "DUMMY: We've covered this point, and I don't want to take up more of your time on it. Would you like to save this and come back later, end the conversation, or carry on?"
pii_reminder: "DUMMY: For your safety, please don't share Aadhaar, card or bank account numbers, or medical reports, in this chat. I don't need them, and identity and card numbers are removed before anything is stored."
side:
  regimes:
    old: "old tax regime"
    new: "new tax regime"
  confirm: "Yes"
  decline: "No"
  save: "Save and come back later"
  end: "End the conversation"
  keep_going: "Carry on"
# Fix 2 (2026-10-29). The re-ask's opening varies, taken in turn; an occupation read from part of
# an answer is confirmed with the customer's words; a "yes" to a money question asks how much;
# relations named without ages get one question for the ages; "prefer not to say" on a
# material-fact question says what follows (TDD §3.6: eligible, no premium shown; V7: applying then
# needs an advisor); the summary's cover-to age can be changed. Compliance reviews the notes.
format_hint_leads:
  - "Let me put that another way."
  - "Sorry, I didn't catch that."
  - "To make sure I get this right:"
amount_ask: "Roughly how much? A rough figure is fine."
dependants_ages: "How old is each of them: {who}? Just the ages, in that order, are fine."
dependant_age: 'How old is your {who}?'
declined_notes:
  tobacco_12m: "That's fine. Without this answer I can still show plans that fit, but not their premiums, because rates depend on it, and applying would then go through a licensed advisor. You can change your answer when I read your details back."
  health_flags: "That's fine. Without this answer I can still show plans that fit, but not their premiums, because the insurer needs it to price the cover, and applying would then go through a licensed advisor. You can change your answer when I read your details back."
cover_to_age:
  question: "Until what age should the cover last? Many people choose the age they plan to retire."
  reason: "It decides how many years of income the cover replaces."
  hint: "At what age would you like the cover to end, for example 58 or 65?"
