# Step 22 (TDD §2.6, §3.9): phrases matched as whole words anywhere in the turn, after NFKC,
# case-folding and collapsing spaces (as needs.yaml). They back up nlu-extract's intents and slots.
# Customer words only: nothing here is ever shown. Owner: compliance; every list awaits its review.

# Regulatory pushback on a question: S1 explains the material-fact reason, S2 the suitability
# purpose, S0 answers from the privacy FAQ, S3 cites the wording.
pushback:
  - why do you need
  - why do you want to know
  - why are you asking
  - why should i tell you
  - why do you ask
  - kyun chahiye
  - kyon chahiye
  - kyun puch rahe ho
  - क्यों चाहिए
  - क्यों पूछ रहे हैं

