# Step 21: State-3 (TDD §3.8). Every number in these texts is filled from the ranker, a quote, the
# alternatives or the catalog; none is written here. The hand-off, journey, exclusion and tax texts
# are legally significant and stay DUMMY until compliance approves them.
rec_retry: "Sorry, I can't show your options right now. Your answers are saved: please try again in a moment."
no_option: "DUMMY: Approved text pending. I couldn't find a plan among ours that fits the needs you described. That isn't a judgement about you: a licensed advisor can look at your needs with you."
rerank_note: "A plan I showed you is no longer available, so here are your options again."
requote_note: "The indicative premiums I showed you have expired, so I have worked them out again."
choose_option: "Which plan would you like to apply for? You can also ask for a lower-cost version of one."
selection_card: |-
  You chose {name} ({uin})
  Cover: {cover}
  Policy term: {term} years
  Premium-paying option: {ppt}
  Riders: {riders}
  Indicative premium: {premium} {period}, including GST. Quote {quote_id}, valid until {valid_until}. The final premium is set after underwriting.
  Protection gap against your recommended cover: {gap}
gap_choice: "This is less cover than the {cover} recommended for your needs. The protection gap is your choice, and you can change it before you apply."
ack_ask: "Before I pass this on, please confirm that you have read the important information, the customer information sheet and the policy wording for {name} ({uin}) shown above."
ack_mismatch: "What you confirmed is not the version I showed you, so here are the options and their information again. Please read them before you confirm."
ack_recorded: "Thank you for confirming that you have read the information for {name} ({uin}). Would you like to apply for it?"
apply_needs_premium: "I can't pass on an application without an indicative premium, and this plan's premium is worked out during underwriting. A licensed advisor can complete the application with you."
handoff_application: "DUMMY: Approved hand-off text pending. Your application for {name} ({uin}) has been passed to our application team with reference {reference}. They will contact you to complete it."
journey_down: "DUMMY: Approved text pending. Your choice and your answers are saved, but I couldn't pass your application on just now. A licensed advisor will complete it with you."
alternatives: "Here are lower-cost versions of {name} ({uin}), each with its protection gap against your recommended cover:"
alternative_line: "{n}. {change}: cover {cover}, {ppt}, riders: {riders}. Indicative premium {premium} {period}. Protection gap: {gap}."
cheaper_unavailable: "This option has no indicative premium yet, so I can't work out lower-cost versions of it. A licensed advisor can help."
which_one: "The choice is yours. Our rules placed {name} ({uin}) first because {reasons}. You can choose any of the options shown, or none of them."
not_recommended: "{name} ({uin}) is not one of your options because {reason}. If you would still like to discuss it, a licensed advisor can help."
exclusion_note: "DUMMY: Approved text pending. Exclusions are part of the approved policy wording, so they can't be changed in this chat. If you disagree with one, a licensed advisor can explain it, and you can raise it through our grievance channel."
tax_condition: "DUMMY: Approved text pending. Whether a tax benefit applies to you depends on the tax regime you choose and your other policies, so I can't work out your tax. Please check with a tax professional."
revise_ask: "Tell me which answer you would like to change, for example your income, your loans or who depends on you."
s3_choices: "You can choose one of the options above, ask me about them, or pick one of these:"
s3_summary: |-
  Here are the options I showed you, saved in this conversation:
  {options}
s3_summary_line: "{name} ({uin}): cover {cover} for {term} years, {premium}"
rediscovery: "Let me revisit a few things. What mattered most to you among the plans we discussed, and what didn't fit?"
decline_first: "That's fine. If none of these suits you, we can revisit your answers, save this for later, or a licensed advisor can help."
declined_exit: "DUMMY: Approved text pending. Thank you for your time. Your answers are kept only as the privacy notice describes."
