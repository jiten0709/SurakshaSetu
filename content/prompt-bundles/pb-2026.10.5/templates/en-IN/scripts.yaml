# Step 20: State-2 (TDD §3.7). The summary and these texts are rendered from the slots and the
# Suitability Service's response, never paraphrased; amounts and rates are filled by the system. The
# exit, non-earning, distress, guarantee and competitor texts are DUMMY until compliance approves.
amount_readback: "Just to check: {amount}. Is that right?"
period_ask: "Is {amount} a month or a year?"
summary_assumed: "Not asked, so assumed: {items}."
summary_implausible: "Some of these figures look unusual. Please check them: if they are right, say yes and I'll note them for the underwriter."
summary_question: "Is this correct?"
partial_offer: "Some questions weren't answered, so any options would rest on a partial profile. Would you like to continue with what we have? If not, I'll ask the remaining questions."
amber_confirm: "The premium for the cover you may need could take a larger share of your income than is usually comfortable. Would you still like to see the options?"
no_gap: "DUMMY: Approved text pending. From what you told me, your existing cover appears sufficient for the needs we discussed, so I won't suggest a new plan. A licensed advisor can review your cover with you through our helpline or at any branch."
needs_done: "Thank you. I have what I need to look for plans that fit."
dependency_down: "Sorry, I can't work out your needs right now."
needs_retry: "Sorry, I can't continue right now. Your answers are saved: please try again in a moment."
non_earning_basis: "DUMMY: Approved text pending. Without a personal income, cover can't be worked out from income: it follows the insurer's rules for people without an income, which a licensed advisor can explain."
distress_ack: "DUMMY: Approved text pending. I'm sorry you're going through this. There's no rush: we can stop here and carry on later, as your answers are saved, or a licensed advisor can talk it through with you."
guarantee_note: "DUMMY: Approved text pending. I can't promise any returns. If we look at plans, I'll explain which benefits are fixed and which can change, only from the policy documents."
competitor_note: "DUMMY: Approved text pending. I can only explain {insurer}'s own plans, so I can't compare plans from other insurers."
rephrase: "Let me put that another way."
short_path_offer: "I can work with just three questions: your income, who depends on you, and any loans. I'll use standard assumptions for the rest and show them to you before anything is worked out. Shall we do that?"
