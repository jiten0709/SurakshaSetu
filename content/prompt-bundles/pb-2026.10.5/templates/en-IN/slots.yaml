# One question per slot, keyed by the DMN tables' reason_line_id, each with its one-line reason. The
# system asks `question` then `reason` verbatim; the model only adds one sentence before them.
# RL-S1-TOBACCO is the TDD §3.6 material-fact question, verbatim. RL-S1-HEALTH is a material-fact
# question that underwriting has not supplied: it stays a DUMMY placeholder until it does.
# `hint` (Step 19, optional) is the format hint after an answer the system could not use. Step 20
# adds hints to the S2 questions; they also follow `rephrase` when the customer did not understand.

RL-S1-AGE:
  question: "How old are you?"
  reason: "Plans have age limits, and age affects the premium."
  hint: "Please tell me your age in years, for example 34."
RL-S1-GENDER:
  question: "What is your gender: male, female or transgender?"
  reason: "This plan's premium rates differ by gender."
  hint: "Please choose one of the options."
RL-S1-RESIDENCY:
  question: "Are you a resident of India, a non-resident Indian, or an OCI or PIO cardholder?"
  reason: "Residency decides which plans can be arranged in this chat."
  hint: "Please choose one of the options."
RL-S1-PINCODE:
  question: "What is your six-digit pincode?"
  reason: "We check that we can serve your area."
  hint: "Please give the six-digit pincode of the place where you live."
RL-S1-TOBACCO:
  question: "Have you used tobacco or nicotine in any form in the last 12 months, such as cigarettes, bidis or gutka?"
  reason: "Premium rates differ, so an accurate answer matters."
  hint: "Please answer yes or no, or say you'd prefer not to say."
RL-S1-OCCUPATION:
  question: "What is your occupation?"
  reason: "Some occupations carry different risks, which affects underwriting."
  hint: "Please describe your job in a few words, for example teacher or software engineer."
RL-S1-HEALTH:
  question: "DUMMY: Approved health screening question pending from underwriting."
  reason: "DUMMY: Approved reason line pending."
  hint: "Please answer yes or no, or say you'd prefer not to say."
RL-S1-PROPOSER:
  question: "Is this cover for your own life?"
  reason: "We need to know whose life the policy would cover."
  hint: "Please answer yes or no."
RL-S1-LA-AGE:
  question: "How old is the person whose life would be covered?"
  reason: "Plans have age limits for the person covered."
  hint: "Please tell me their age in years."
RL-S1-LA-RELATIONSHIP:
  question: "How are you related to the person whose life would be covered?"
  reason: "Some relationships are arranged with a licensed advisor."
  hint: "Please choose one of the options."
RL-S1-BUSINESS-COVER:
  question: "Is this cover for a business purpose, such as key-person or partnership cover?"
  reason: "Business cover is arranged with a licensed advisor."
  hint: "Please answer yes or no."

RL-S2-GOALS:
  question: "What should this cover do for you? You can choose more than one: protect your family's income, pay off a loan, fund a child's education, retirement, or savings."
  reason: "Your goals decide which types of plan fit."
  hint: "Please choose one or more goals below, or name them, most important first."
RL-S2-INCOME:
  question: "What is your annual income?"
  reason: "Cover is usually sized against income, and it helps check what is affordable."
  hint: "Please give an amount, for example 12 lakh a year or 80,000 a month, or say you'd prefer not to say."
RL-S2-INCOME-TYPE:
  question: "Are you salaried, self-employed, a homemaker, a student or retired?"
  reason: "It decides how cover is worked out and what proof is needed later."
  hint: "Please choose one of the options."
RL-S2-DEPENDANTS:
  question: "Who depends on you financially, and how old is each of them?"
  reason: "Dependants decide how long the cover needs to last."
  hint: "Please tell me each person and their age, for example wife 32 and son 4, or say no one. Names are not needed."
RL-S2-LIABILITIES:
  question: "Do you have any loans? If so, what kind, how much is still owed and how many years are left?"
  reason: "Cover can be sized to repay loans."
  hint: "Please tell me the kind of loan, the amount still owed and the years left, for example home loan 35 lakh, 18 years left, or say no loans."
RL-S2-EXISTING-COVER:
  question: "How much life cover do you already have in your own policies?"
  reason: "Existing cover is counted against what you need."
  hint: "Please give the total cover, for example 50 lakh, or say none."
RL-S2-EMPLOYER-COVER:
  question: "Does your employer give you group life cover? If so, how much?"
  reason: "Part of employer cover may count towards what you need."
  hint: "Please give the amount of cover, for example 15 lakh, or say no."
RL-S2-EXISTING-PREMIUM:
  question: "How much do you pay each year in premiums for the policies you already have?"
  reason: "It helps check that a new premium stays affordable."
  hint: "Please give the yearly total, for example 25,000 a year, or say none."
RL-S2-ASSETS:
  question: "Have you set aside savings or investments for your family's needs? You can skip this."
  reason: "Money set aside reduces the cover you need."
  hint: "Please give the amount set aside, for example 10 lakh, or say none or skip."
RL-S2-BUDGET:
  question: "Do you have a yearly premium budget in mind? You can skip this."
  reason: "It helps keep the options within what you can afford."
  hint: "Please give a yearly amount, for example 30,000 a year, or say skip."
