spring.application.name=domain-services
# Framework errors render as RFC 9457 application/problem+json, as the tier contract requires;
# common/ProblemHandler adds the contract's `code` to each.
spring.mvc.problemdetails.enabled=true
# Structured JSON on the console (Spring Boot's built-in ECS format), matching the orchestrator's JSON lines.
logging.structured.format.console=ecs

# The primary datasource is domain_rw (URL and credentials from the environment). The name shows in
# pg_stat_activity.
spring.datasource.hikari.data-source-properties.ApplicationName=domain-services
# The catalog writer, for the kill switch and the seed loader only (common/CatalogLoaderDb). The
# password has no default: startup fails without it.
surakshasetu.catalog-loader.username=catalog_loader

# valid_p1 lapses this long after capture (D7 open; the TDD's proposed value).
surakshasetu.consent.ttl-days=30

# /v1/meta/versions. Rules and params come from the loaded DMN releases (common/Rules); ranker and
# rating are stubs until Step 7.
surakshasetu.versions.ranker=ranker-stub
surakshasetu.versions.rating=rating-stub
surakshasetu.versions.registry=2026.09.1

# The seed loader's input (content/seed from the repo root; compose mounts it at /content/seed).
# Below the separator, profile catalog-sync (`make seed-catalog`) loads it and exits with no web
# server. The lines next to a `#---` separator must not be comments.
surakshasetu.seed.dir=../content/seed
#---
spring.config.activate.on-profile=catalog-sync
spring.main.web-application-type=none
