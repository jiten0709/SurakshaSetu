# Local infrastructure. `make up` starts the core profile. Every image is pinned to an exact tag.
# Credentials default to dummy local values; override them in infra/.env (gitignored).
name: surakshasetu

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 5s
  retries: 30

# Embedding and rerank models (TEI, CPU). The adapter calls them directly, never through the
# model gateway. The default tag is arm64-only; amd64 hosts set TEI_IMAGE=…:cpu-1.9.4. Weights
# are pinned by revision and downloaded once into tei-models on the first start.
# Memory, for an 8 GB Docker VM (both models together need about 5 GB):
# - --tokenization-workers=2: TEI starts one tokenizer per CPU by default, and each copy of the
#   XLM-R vocabulary both models share costs a few hundred MB; 11 copies OOM-killed the VM.
# - --max-batch-tokens=2048 also caps each input (auto-truncate is on). The longest real input
#   is a rerank pair, about 1,200 tokens (a 500-token query and a 600-token chunk with its
#   breadcrumb), so nothing real is cut. GPU deployments size both knobs to their hardware.
x-tei: &tei
  image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-1.9.4}
  profiles: [core]
  volumes:
    - tei-models:/data
  healthcheck:
    <<: *healthcheck
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:80/health"]
    # The first start downloads about 2.9 GB of weights, at 0.5-2 MB/s from the Hub on a slow
    # link. Once cached, a start takes seconds and the first passing check ends this period.
    start_period: 60m

services:
  postgres:
    image: postgres:16.15-trixie
    profiles: [core]
    command: ["postgres", "-c", "wal_level=logical"] # Debezium CDC (Step 24)
    environment:
      POSTGRES_DB: surakshasetu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-surakshasetu-dev}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      <<: *healthcheck
      # TCP, not the socket: the init-time server listens on the socket only.
      test:
        [
          "CMD",
          "pg_isready",
          "-h",
          "127.0.0.1",
          "-U",
          "postgres",
          "-d",
          "surakshasetu",
        ]

  valkey:
    image: valkey/valkey:9.1.2-alpine3.24
    profiles: [core]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "valkey-cli", "ping"]

  qdrant:
    image: qdrant/qdrant:v1.19.1
    profiles: [core]
    ports: ["127.0.0.1:6333:6333", "127.0.0.1:6334:6334"]
    volumes:
      - qdrant:/qdrant/storage
      # Collection snapshots taken by kb-ingest (Step 11); outside the image, so they survive a
      # container recreate.
      - qdrant-snapshots:/qdrant/snapshots
    healthcheck:
      <<: *healthcheck
      # The image ships no HTTP client.
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3",
        ]

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: [core]
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-surakshasetu}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-surakshasetu-dev-minio}
    ports: ["127.0.0.1:9000:9000"]
    volumes:
      - minio:/data
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "mc", "ready", "local"]

  # One-shot: its exit code is its health. Fails if either bucket lacks object lock, which can
  # only be enabled at bucket creation.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: [core]
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:-surakshasetu}:${MINIO_ROOT_PASSWORD:-surakshasetu-dev-minio}@minio:9000
    entrypoint: ["bash", "-euo", "pipefail", "-c"]
    command:
      - |
        for bucket in audit-anchors audit-archive; do
          mc mb --ignore-existing --with-lock "local/$$bucket"
          [[ "$$(mc stat --json "local/$$bucket")" == *'"ObjectLock":{"enabled":"Enabled"'* ]] \
            || { echo "$$bucket: object lock is not enabled" >&2; exit 1; }
        done

  # One-shot, like minio-init: its exit code is its health. `make db-migrate` runs it once per
  # database by overriding FLYWAY_URL. Same Flyway version Spring Boot manages for MigrationsIT.
  flyway:
    image: flyway/flyway:12.4.0
    profiles: [core]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/surakshasetu
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-surakshasetu-dev}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      # Keeps the history table out of public, which must stay empty.
      FLYWAY_DEFAULT_SCHEMA: flyway
      REDGATE_DISABLE_TELEMETRY: "true"
      FLYWAY_PLACEHOLDERS_APP_RW_PASSWORD: ${APP_RW_PASSWORD:-surakshasetu-dev-app-rw}
      FLYWAY_PLACEHOLDERS_DOMAIN_RW_PASSWORD: ${DOMAIN_RW_PASSWORD:-surakshasetu-dev-domain-rw}
      FLYWAY_PLACEHOLDERS_CATALOG_LOADER_PASSWORD: ${CATALOG_LOADER_PASSWORD:-surakshasetu-dev-catalog-loader}
      FLYWAY_PLACEHOLDERS_ERASURE_RW_PASSWORD: ${ERASURE_RW_PASSWORD:-surakshasetu-dev-erasure-rw}
      FLYWAY_PLACEHOLDERS_KEYVAULT_RW_PASSWORD: ${KEYVAULT_RW_PASSWORD:-surakshasetu-dev-keyvault-rw}
      FLYWAY_PLACEHOLDERS_COMPLIANCE_RO_PASSWORD: ${COMPLIANCE_RO_PASSWORD:-surakshasetu-dev-compliance-ro}
    volumes:
      - ./db/migrations:/flyway/sql:ro
    command: ["migrate"]

  domain-services:
    build:
      context: ../domain-services
      # The Maven build generates its interfaces from the tier contract.
      additional_contexts:
        contracts: ../contracts
    profiles: [core]
    depends_on:
      postgres: { condition: service_healthy }
    # Least privilege: domain_rw writes consent and reads the catalog; catalog_loader is used only
    # by the kill switch and the seed loader. The roles exist before this starts because `make up`
    # runs db-migrate first.
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/surakshasetu
      SPRING_DATASOURCE_USERNAME: domain_rw
      SPRING_DATASOURCE_PASSWORD: ${DOMAIN_RW_PASSWORD:-surakshasetu-dev-domain-rw}
      SURAKSHASETU_CATALOGLOADER_PASSWORD: ${CATALOG_LOADER_PASSWORD:-surakshasetu-dev-catalog-loader}
      SURAKSHASETU_SEED_DIR: /content/seed
    # Read by `make seed-catalog` (profile catalog-sync) only.
    volumes:
      - ../content/seed:/content/seed:ro
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      start_period: 60s

  tei-embed:
    <<: *tei
    command:
      - --json-output
      - --model-id=BAAI/bge-m3
      - --revision=5617a9f61b028005a4858fdac845db406aefb181
      - --max-batch-tokens=2048
      - --tokenization-workers=2
    ports: ["127.0.0.1:8081:80"]

  tei-rerank:
    <<: *tei
    command:
      - --json-output
      - --model-id=Alibaba-NLP/gte-multilingual-reranker-base
      - --revision=8215cf04918ba6f7b6a62bb44238ce2953d8831c
      - --max-batch-tokens=2048
      - --tokenization-workers=2
      # Retrieval reranks up to 120 candidates in one call; TEI's default limit is 32.
      - --max-client-batch-size=128
    ports: ["127.0.0.1:8082:80"]

  # Deterministic stand-in for the chat models, behind omniroute. Tests script it directly.
  stubs:
    build: ../tools/stubs
    profiles: [core]
    ports: ["127.0.0.1:8090:8090"]
    healthcheck:
      <<: *healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=3)",
        ]

  # The model gateway for the chat routes (TDD §1.5-1.6, Step 9): SurakshaSetu's own OmniRoute,
  # hardened by the env below and by infra/omniroute/seed.json, which `make gateway-up` applies
  # through its admin API and verifies. infra/omniroute/HARDENING.md maps each row to its test.
  # Profile gateway, so `make up` stays independent of it.
  omniroute:
    image: diegosouzapw/omniroute:3.8.50@sha256:085c57adf499a8aaa9f35ccde95c0df9c11bd9ecd18d6c9edbf3b68b8079ba9d
    profiles: [gateway]
    depends_on:
      stubs: { condition: service_healthy }
    environment:
      # Dummy local secrets; override in infra/.env. INITIAL_PASSWORD is read on first boot only.
      # OmniRoute refuses to start with a JWT_SECRET under 32 characters or an API_KEY_SECRET
      # under 16.
      INITIAL_PASSWORD: ${OMNIROUTE_INITIAL_PASSWORD:-surakshasetu-dev-omniroute}
      JWT_SECRET: ${OMNIROUTE_JWT_SECRET:-surakshasetu-dev-omniroute-jwt-signing}
      API_KEY_SECRET: ${OMNIROUTE_API_KEY_SECRET:-surakshasetu-dev-omniroute-api-key}
      # Unset, credentials are stored in plaintext.
      STORAGE_ENCRYPTION_KEY: ${OMNIROUTE_STORAGE_ENCRYPTION_KEY:-surakshasetu-dev-omniroute-storage}
      REQUIRE_API_KEY: "true"
      # Second-line guardrails (your decision, 2026-09-28): detect injections without blocking,
      # so guard-input still classifies every attack; mask PII on every route.
      INPUT_SANITIZER_ENABLED: "true"
      INJECTION_GUARD_MODE: warn
      PII_REDACTION_ENABLED: "true"
      ENABLE_TLS_FINGERPRINT: "false"
      ENABLE_SOCKS5_PROXY: "false"
      OMNIROUTE_MCP_ENFORCE_SCOPES: "true"
      # A budget error would otherwise retry on an external model outside the combo.
      OMNIROUTE_EMERGENCY_FALLBACK: "false"
      # OMNIROUTE_API_KEY stays unset: A2A would route with it and bypass the key policy.
    ports: ["127.0.0.1:20130:20128"]
    volumes:
      - omniroute-data:/app/data
    # Time for SQLite to checkpoint on shutdown.
    stop_grace_period: 40s
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "node", "healthcheck.mjs"]
      start_period: 60s

volumes:
  pgdata:
  qdrant:
  qdrant-snapshots:
  minio:
  tei-models:
  omniroute-data:
