[project]
name = "surakshasetu"
version = "0.1.0"
description = "SurakshaSetu conversation tier: Conversation API and LangGraph orchestrator."
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langgraph-checkpoint-postgres>=3.1.2",
    "minio>=7.2.20",
    "psycopg[binary,pool]>=3",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "rfc8785>=0.1.4",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.82.0",
    "hypothesis>=6.168.0",
    "mypy>=2.3.1",
    "openapi-spec-validator>=0.9.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.8",
    "schemathesis>=4.28.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Generated from the contract; long lines are spec descriptions.
"src/surakshasetu/domain/models.py" = ["E501"]

# `make contracts` and `make check-contracts` both read this; only --output differs.
[tool.datamodel-codegen]
input = "../contracts/openapi/domain-services.v1.yaml"
input-file-type = "openapi"
output-model-type = "pydantic_v2.BaseModel"
target-python-version = "3.12"
formatters = ["ruff-format", "ruff-check"]
use-type-alias = true
enum-field-as-literal = "all"
use-annotated = true
strict-nullable = true
output-datetime-class = "AwareDatetime"
disable-timestamp = true

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "db: needs PostgreSQL from the core compose profile",
    "stack: needs the full compose stack",
    "golden: golden conversation suites",
    "redteam: red-team suite",
    "live: calls real model routes",
]
